openapi: 3.1.0
info:
  title: Revisão de questões do Digitalizador
  version: 1.0.0
  description: Consulta questões e catálogos ativos e aplica correções validadas.
servers:
  - url: https://SEU-APP.lovable.app/api
security:
  - bearerAuth: []
paths:
  /question-review:
    get:
      operationId: consultarQuestoesParaRevisao
      summary: Consultar questões e catálogos
      description: >
        Busque questões por IDs ou filtros. Use incluir_catalogos=true para obter
        também as opções ativas de classificação. Sem filtros de questão, esse
        parâmetro retorna apenas os catálogos.
      parameters:
        - name: ids
          in: query
          required: false
          description: IDs UUID das questões. Pode repetir o parâmetro ou enviar valores separados por vírgula; máximo 25.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 25
            items:
              type: string
              format: uuid
        - name: ano
          in: query
          required: false
          description: Um ou mais anos; valores diferentes usam lógica OR.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: prova
          in: query
          required: false
          description: Uma ou mais provas; valores diferentes usam lógica OR.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: instituicao
          in: query
          required: false
          description: Uma ou mais instituições; valores diferentes usam lógica OR.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: numero
          in: query
          required: false
          schema:
            type: string
        - name: grupo_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: incluir_catalogos
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Questões, paginação e, quando solicitado, catálogos ativos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewReadResponse"
        "400":
          description: Filtros ou paginação inválidos.
        "401":
          description: Token inválido.
        "502":
          description: Falha ao consultar dados.
        "503":
          description: Token não configurado no servidor.
    patch:
      operationId: corrigirQuestoesRevisadas
      summary: Gravar correções de questões
      description: >
        Aplique somente campos revisados. Envie o updated_at lido no GET como
        expected_updated_at. Campos de imagem e posicionamento são somente leitura.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewPatchRequest"
      responses:
        "200":
          description: Resultado individual para cada questão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPatchResponse"
        "400":
          description: JSON inválido ou lote malformado.
        "401":
          description: Token inválido.
        "409":
          description: Conflito de versão ou referência compartilhada incompleta.
        "415":
          description: Content-Type incompatível.
        "422":
          description: Correções incompatíveis com o catálogo ou com as alternativas.
        "502":
          description: Falha ao consultar ou gravar.
        "503":
          description: Token não configurado no servidor.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ReviewReadResponse:
      type: object
      required: [ok, questions, pagination]
      properties:
        ok:
          type: boolean
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        pagination:
          type: object
          required: [total, limit, offset, has_more]
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
            has_more:
              type: boolean
        catalogos:
          type: object
          description: Catálogos ativos, incluídos quando incluir_catalogos=true.
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
    Question:
      type: object
      required: [id, enunciado, alternativas, updated_at]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: [string, "null"]
        enunciado:
          type: string
        alternativas:
          type: array
          items:
            type: object
            properties:
              letra:
                type: string
              texto:
                type: string
              imagem:
                type: [string, "null"]
            additionalProperties: true
        tipo:
          type: string
        resposta:
          type: [string, "null"]
        fonte:
          type: [string, "null"]
        disciplina:
          type: [string, "null"]
        conteudo:
          type: [string, "null"]
        dificuldade:
          type: [string, "null"]
        area_geral:
          type: [string, "null"]
        conteudo_principal:
          type: [string, "null"]
        subconteudo_principal:
          type: [string, "null"]
        conteudos_relacionados:
          type: array
          items:
            type: string
        tags_livres:
          type: array
          items:
            type: string
        tags:
          type: [array, "null"]
          items:
            type: string
        ano:
          type: [string, "null"]
        prova:
          type: [string, "null"]
        instituicao:
          type: [string, "null"]
        observacoes:
          type: [string, "null"]
        referencia_texto:
          type: [string, "null"]
        referencia_texto_apos:
          type: [string, "null"]
        referencia_fonte:
          type: [string, "null"]
        referencia_imagem:
          type: [string, "null"]
        referencia_imagem_pos:
          type: [string, "null"]
        referencia_imagem_layout:
          type: object
          description: Posicionamento atual da imagem, somente leitura.
          additionalProperties: true
        referencia_imagens_extra:
          type: array
          description: Imagens adicionais atuais, somente leitura.
          items:
            type: object
            additionalProperties: true
        enunciado_imagem:
          type: [string, "null"]
        enunciado_imagem_pos:
          type: [string, "null"]
        enunciado_imagem_layout:
          type: object
          description: Posicionamento atual da imagem, somente leitura.
          additionalProperties: true
        enunciado_imagens_extra:
          type: array
          description: Imagens adicionais atuais, somente leitura.
          items:
            type: object
            additionalProperties: true
        imagem_original_url:
          type: [string, "null"]
        tem_equacao:
          type: boolean
        tem_imagem:
          type: boolean
        grupo_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    ReviewPatchRequest:
      type: object
      required: [updates]
      additionalProperties: false
      properties:
        updates:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: "#/components/schemas/ReviewUpdate"
    ReviewUpdate:
      type: object
      required: [id, expected_updated_at, changes]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        expected_updated_at:
          type: string
          description: Valor exato de updated_at recebido na consulta mais recente.
        changes:
          $ref: "#/components/schemas/QuestionChanges"
    QuestionChanges:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        numero:
          type: [string, "null"]
        enunciado:
          type: string
          minLength: 1
          maxLength: 30000
        alternativas:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [letra, texto]
            additionalProperties: false
            properties:
              letra:
                type: string
                pattern: "^[A-Z]$"
              texto:
                type: string
                maxLength: 12000
        tipo:
          type: string
          minLength: 1
          maxLength: 50
        resposta:
          type: [string, "null"]
          pattern: "^[A-Z]$"
        fonte:
          type: [string, "null"]
        area_geral:
          type: [string, "null"]
        conteudo_principal:
          type: [string, "null"]
        subconteudo_principal:
          type: [string, "null"]
        conteudos_relacionados:
          type: array
          maxItems: 30
          items:
            type: string
        tags_livres:
          type: array
          maxItems: 30
          items:
            type: string
        dificuldade:
          type: [string, "null"]
        ano:
          type: [string, "null"]
        prova:
          type: [string, "null"]
        instituicao:
          type: [string, "null"]
        observacoes:
          type: [string, "null"]
        referencia_texto:
          type: [string, "null"]
          maxLength: 40000
        referencia_texto_apos:
          type: [string, "null"]
          maxLength: 40000
        referencia_fonte:
          type: [string, "null"]
        tem_equacao:
          type: boolean
    ReviewPatchResponse:
      type: object
      properties:
        ok:
          type: boolean
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
                enum: [updated, not_found, conflict, invalid, failed]
              changed_fields:
                type: array
                items:
                  type: string
              before:
                type: object
                additionalProperties: true
              after:
                type: object
                additionalProperties: true
              updated_at:
                type: string
                format: date-time
              error:
                type: string
            additionalProperties: true
